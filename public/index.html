<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="HackerZone - Capture The Flag Competition Platform">
    <title>HackerZone CTF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <span class="logo-icon"><i class="fas fa-skull-crossbones"></i></span>
                <span class="logo-text">HackerZone</span>
            </a>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/" class="nav-link active" data-page="home">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="/challenges" class="nav-link" data-page="challenges">
                <i class="fas fa-flag"></i> Challenges
            </a>
            <a href="/leaderboard" class="nav-link" data-page="leaderboard">
                <i class="fas fa-trophy"></i> Leaderboard
            </a>
        </div>
        <div class="nav-auth" id="navAuth">
            <!-- Dynamic auth buttons -->
        </div>
        <div class="nav-toggle" id="navToggle">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Dynamic content loaded here -->
    </main>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic modal content -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 HackerZone CTF Platform. All rights reserved.</p>
            <p class="footer-tagline">Hack The Planet! 🌍</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
